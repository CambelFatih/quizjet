name: SEO checks

# No pull_request trigger (owner decision, 2026-11-04): opening a PR runs nothing. The same three
# checks run on every push to main here and again in deploy.yml before the site is published;
# run them by hand before a PR: build_locales.py --check, check_seo.py, test_build_discover.py.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate static pages and SEO metadata
        run: |
          python scripts/build_locales.py --check
          python scripts/check_seo.py
          python scripts/test_build_discover.py

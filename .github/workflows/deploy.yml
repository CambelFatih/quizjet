name: Build and deploy site

# Publishes the committed static pages plus the public Discover catalog to GitHub Pages.
# Runs once a day so the catalog follows the bot, on every push to main, and on demand
# (Actions → "Build and deploy site" → Run workflow) for an urgent removal.
#
# Requires: Settings → Pages → Source = "GitHub Actions".
# Optional: secret QUIZJET_EXPORT_TOKEN (same value as the bot's MiniApp__DiscoverExportToken).
# Without the secret the site is published with a "coming soon" /discover/ page; with it, a failed
# catalog fetch stops the run and the last good deployment stays online.

on:
  schedule:
    - cron: "41 2 * * *" # 02:41 UTC = 05:41 Türkiye, off the busy top of the hour
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # the daily news lesson is committed back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Write today's news lesson
        # Needs the OPENAI_API_KEY secret; without it the site is published without news.
        # Nothing is generated (or billed) when _data/news/<today>.json already exists, so the push-to-main
        # run after the daily one costs nothing. The file is committed so the archive of lessons stays;
        # a push by GITHUB_TOKEN starts no second workflow run. Copyright posture: scripts/build_news.py.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::OPENAI_API_KEY is not set; publishing without a new news lesson."
            exit 0
          fi
          # A queued run checks out an older commit: take main's tip first, so a lesson another run just committed is seen.
          git pull -q --ff-only origin main || echo "::warning::Could not fast-forward to main; generating from this commit."
          python scripts/build_news.py --generate || { echo "::warning::News generation failed; publishing without a new lesson."; exit 0; }
          if [ -n "$(git status --porcelain _data/news)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/news
            git commit -m "News lesson $(date -u +%F)"
            git pull --rebase origin main && git push origin HEAD:main \
              || echo "::warning::Could not push the lesson to main; it is published from this run only."
          fi

      - name: Check static pages
        run: |
          python scripts/build_locales.py --check
          python scripts/check_seo.py
          python scripts/test_build_discover.py
          python scripts/test_build_news.py

      - name: Fetch Discover catalog
        env:
          TOKEN: ${{ secrets.QUIZJET_EXPORT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::QUIZJET_EXPORT_TOKEN is not set; publishing without the Discover catalog."
            exit 0
          fi
          curl -fsS --retry 3 --retry-all-errors --max-time 120 \
            -H "X-Export-Token: $TOKEN" \
            https://api.quizjet.app/public/discover/export -o "$RUNNER_TEMP/export.json"

      - name: Build site
        run: |
          args=(--out "$RUNNER_TEMP/site")
          if [ -f "$RUNNER_TEMP/export.json" ]; then args+=(--export "$RUNNER_TEMP/export.json"); fi
          python scripts/build_discover.py "${args[@]}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      # actions/deploy-pages waits at most 10 minutes: a larger timeout is cut back to 600000 with a warning (run #30,
      # 2026-11-06, where Pages queued the deployment for 7 minutes and the merge never went live). The only lever is
      # a second attempt, which gets a fresh 10 minutes and usually a shorter queue.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 600000

      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000

name: SEO checks

# Manual only (owner decision, 2026-11-07): no PR and no push runs this. The same four checks run in
# deploy.yml before every publish (push to main, daily, manual), so a push-triggered copy here tested the
# same commit twice. Run them by hand before a PR: build_locales.py --check, check_seo.py,
# test_build_discover.py, test_build_news.py — or start this workflow from Actions > "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate static pages and SEO metadata
        run: |
          python scripts/build_locales.py --check
          python scripts/check_seo.py
          python scripts/test_build_discover.py
          python scripts/test_build_news.py
